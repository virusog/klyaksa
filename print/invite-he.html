<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הזמנה לבלוביקה</title>
<!-- Two A5 invitations on one A4 sheet, black and white. Print at 100%, cut along the dashed line.
     Make the PDF with: print/make-pdf.sh -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: 'Rubik', 'Arial Hebrew', sans-serif; font-size: 10.2pt; line-height: 1.34; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { width: 297mm; height: 210mm; display: flex; position: relative; overflow: hidden; }
  .sheet::after { content: ''; position: absolute; top: 6mm; bottom: 6mm; left: 50%; border-left: .35mm dashed #000; }
  .cut { position: absolute; left: 50%; top: 2mm; transform: translateX(-50%); font-size: 9pt; background: #fff; padding: 0 1mm; z-index: 1; }
  .card { width: 148.5mm; height: 210mm; padding: 8.5mm 10mm 9mm; display: flex; flex-direction: column; gap: 2.6mm; }

  .head { display: flex; align-items: center; gap: 4mm; }
  .mascot { width: 24mm; flex: none; position: relative; }
  .mascot svg { width: 100%; display: block; }
  .mascot small { display: block; text-align: center; font-size: 8pt; font-weight: 500; margin-top: .5mm; white-space: nowrap; }
  h1 { font-size: 31pt; font-weight: 900; margin: 0; line-height: 1; letter-spacing: .3mm; }
  .sub { font-size: 12.5pt; font-weight: 700; margin: 1.2mm 0 0; }
  .lat { font-size: 9pt; margin-top: .6mm; direction: ltr; text-align: right; }

  .to { display: flex; gap: 5mm; font-size: 10.5pt; font-weight: 500; }
  .to span { flex: 1; display: flex; align-items: baseline; gap: 1.5mm; white-space: nowrap; }
  .to i { flex: 1; border-bottom: .3mm solid #000; height: 5mm; }

  .lead { margin: 0; font-size: 10pt; }
  h2 { font-size: 11.5pt; font-weight: 900; margin: 0 0 1.2mm; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5mm; }
  li { padding-inline-start: 4.2mm; position: relative; }
  ul li::before { content: '★'; position: absolute; inset-inline-start: 0; top: -.2mm; font-size: 8.5pt; }

  .join { border: .5mm solid #000; border-radius: 4mm; padding: 3mm 3.5mm; display: flex; gap: 3.5mm; align-items: flex-start; }
  .steps { flex: 1; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 1.3mm; }
  ol li { counter-increment: s; padding-inline-start: 6.2mm; }
  ol li::before { content: counter(s); position: absolute; inset-inline-start: 0; top: .1mm; width: 4.4mm; height: 4.4mm; border: .3mm solid #000; border-radius: 50%; font-size: 7.5pt; font-weight: 700; display: grid; place-items: center; line-height: 1; }
  .qr { width: 33mm; flex: none; text-align: center; font-size: 7.5pt; font-weight: 500; }
  .qr svg { width: 33mm; height: 33mm; display: block; margin-bottom: 1mm; }
  b.ui { font-weight: 700; white-space: nowrap; }

  .code { display: flex; align-items: center; justify-content: center; gap: 3mm; border: .5mm dashed #000; border-radius: 3mm; padding: 2mm 3mm; }
  .code span { font-size: 11pt; font-weight: 700; }
  .code tt { direction: ltr; font-family: 'Menlo', 'Courier New', monospace; font-size: 20pt; font-weight: 700; letter-spacing: .4mm; }
  .code em { font-style: normal; font-size: 9pt; direction: ltr; }

  .install { border: .5mm solid #000; border-radius: 4mm; padding: 2.6mm 3.5mm; }
  .install h2 { margin-bottom: 1.8mm; }
  .flow { display: flex; align-items: center; gap: 2mm; flex-wrap: wrap; font-size: 10pt; }
  .flow span { display: inline-flex; align-items: center; gap: 1.2mm; white-space: nowrap; }
  .flow svg { width: 6.5mm; height: 6.5mm; flex: none; }
  .flow i { font-style: normal; font-weight: 700; }
  .install p { margin: 1.8mm 0 0; font-size: 8.8pt; line-height: 1.35; }

  .parents { margin-top: auto; font-size: 8.2pt; line-height: 1.3; border-top: .3mm solid #000; padding-top: 1.8mm; }
  .parents b { font-weight: 700; }
</style>
</head>
<body>
<div class="sheet" id="sheet"><span class="cut">✂</span></div>

<template id="card">
<section class="card">
  <div class="head">
    <div class="mascot">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path d="M60 9C82 6 96 17 100 33c6 8 16 13 12 26-3 9-11 9-12 15-2 10 5 19-5 28-10 8-20 1-30 7-11 6-21 8-31 0-8-8-1-16-11-22C14 87 6 78 8 62c2-12 14-12 16-24C28 18 40 11 60 9Z" fill="#fff" stroke="#000" stroke-width="4"/>
        <ellipse cx="44" cy="52" rx="11" ry="14" fill="#fff" stroke="#000" stroke-width="3"/>
        <ellipse cx="76" cy="52" rx="11" ry="14" fill="#fff" stroke="#000" stroke-width="3"/>
        <circle cx="47" cy="55" r="6"/><circle cx="73" cy="55" r="6"/>
        <circle cx="49" cy="52" r="2.2" fill="#fff"/><circle cx="75" cy="52" r="2.2" fill="#fff"/>
        <path d="M42 70q18 28 36 0z" fill="#000"/>
        <circle cx="30" cy="70" r="5.5" fill="none" stroke="#000" stroke-width="1.5"/><circle cx="90" cy="70" r="5.5" fill="none" stroke="#000" stroke-width="1.5"/>
      </svg>
      <small>צבעי אותי!</small>
    </div>
    <div>
      <h1>בלוביקה</h1>
      <p class="sub">מציירות, משחקות ומתחרות ביחד!</p>
      <div class="lat">Blobika · blobika.com</div>
    </div>
  </div>

  <div class="to">
    <span>הזמנה ל: <i></i></span>
    <span>מאת: <i></i></span>
  </div>

  <p class="lead">בואי לצייר ולשחק איתי בבלוביקה! היא <b>בחינם</b>, בלי פרסומות ובלי הרשמה.</p>

  <ul>
    <li><b>סטודיו, דפי צביעה וצביעה לפי מספרים</b> – ציירי וצבעי מה שבא לך.</li>
    <li><b>בית ספר לציור</b> – לומדים לצייר צעד אחר צעד.</li>
    <li><b>העולם החי</b> – הציורים שלך מתעוררים לחיים!</li>
    <li><b>משחקים</b> – פאזלים, זוגות, סרטים מצוירים ופיקסלים.</li>
    <li><b>כוכבים, מתנות וטבלת המובילות של הכיתה</b> – מי אספה הכי הרבה?</li>
  </ul>

  <div class="join">
    <div class="steps">
      <h2>איך מצטרפים לכיתה שלנו?</h2>
      <ol>
        <li>סורקים את הקוד במצלמה, או פותחים <b class="ui">blobika.com</b> בספארי.</li>
        <li>שמים את בלוביקה במסך הבית (ראו למטה) ופותחים מהסמל.</li>
        <li>בוחרים שפה, כותבים שם ובוחרים סמל.</li>
        <li>ב<b class="ui">"טבלת המובילות"</b> בודקים שאת בכיתה שלנו. אם לא, מקלידים את קוד הכיתה ולוחצים <b class="ui">"כניסה לכיתה שלי"</b>.</li>
      </ol>
    </div>
    <div class="qr">
      <!--QR-->
      סרקי אותי
    </div>
  </div>

  <div class="code">
    <span>קוד הכיתה:</span>
    <tt>class-4ezgt7</tt>
  </div>

  <div class="install">
    <h2>איך שמים את בלוביקה באייפד כמו אפליקציה?</h2>
    <div class="flow">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 9H6v12h12V9h-2.5" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15V3M8.2 6.8 12 3l3.8 3.8" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>בספארי לוחצים <b class="ui">"שיתוף"</b></span>
      <i>←</i>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="#000" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg><b class="ui">"הוספה למסך הבית"</b></span>
      <i>←</i>
      <span><b class="ui">"הוספה"</b></span>
    </div>
    <p>מעכשיו פותחים את בלוביקה <b>רק מהסמל</b>: על כל המסך, גם בלי אינטרנט, והציורים נשמרים. אם אין "שיתוף" בסרגל, לוחצים קודם על <b>⋯</b>.<br>בטלפון אנדרואיד, בכרום: <b>⋮</b> ← <b class="ui">"הוספה למסך הבית"</b>.</p>
  </div>

  <p class="parents"><b>להורים:</b> בטבלת המובילות רואים רק את השם, הסמל ומספר הכוכבים, ורק בנות הכיתה עם אותו קוד. הציורים נשמרים רק במכשיר. אפשר לכבות את הטבלה בכל רגע באזור <b>"להורים"</b> (סמל גלגל השיניים).</p>
</section>
</template>

<script>
  const QR = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 33 33" shape-rendering="crispEdges"><path fill="#fff" d="M-2 -2h33v33H-2z"/><path stroke="#000" d="M0 0.5h7m4 0h1m4 0h5m1 0h7M0 1.5h1m5 0h1m3 0h2m1 0h3m4 0h1m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h5m1 0h1m3 0h2m2 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h2m1 0h2m4 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m2 0h2m1 0h1m1 0h1m1 0h3m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m1 0h3m1 0h3m1 0h1m1 0h1m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m6 0h2m2 0h2M0 8.5h1m1 0h5m4 0h3m1 0h1m1 0h1m1 0h2m1 0h5M4 9.5h2m2 0h1m2 0h1m2 0h1m1 0h1m2 0h1m1 0h4m3 0h1M1 10.5h1m1 0h1m2 0h1m1 0h1m3 0h4m1 0h2m1 0h3M8 11.5h1m1 0h2m2 0h3m2 0h2m3 0h2m1 0h1M2 12.5h6m1 0h2m1 0h1m2 0h3m1 0h1m5 0h2M5 13.5h1m2 0h1m2 0h3m5 0h1m1 0h4m3 0h1M0 14.5h1m1 0h1m1 0h5m3 0h7m1 0h4m1 0h2M5 15.5h1m6 0h2m1 0h2m3 0h1m1 0h2m3 0h1M0 16.5h3m2 0h4m2 0h2m1 0h1m2 0h3m5 0h2M0 17.5h1m2 0h3m3 0h1m1 0h1m5 0h1m1 0h6m1 0h1m1 0h1M0 18.5h1m1 0h1m1 0h3m1 0h2m1 0h1m3 0h2m3 0h2m2 0h1m1 0h1M0 19.5h1m1 0h1m2 0h1m3 0h1m2 0h1m1 0h1m4 0h2m2 0h1m3 0h1M0 20.5h1m2 0h1m2 0h1m3 0h3m2 0h3m1 0h6m1 0h3M8 21.5h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h1m3 0h5M0 22.5h7m2 0h1m1 0h10m1 0h1m1 0h3M0 23.5h1m5 0h1m1 0h1m2 0h3m5 0h2m3 0h1m3 0h1M0 24.5h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h4m2 0h5m1 0h1M0 25.5h1m1 0h3m1 0h1m1 0h2m2 0h2m2 0h6m3 0h4M0 26.5h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m1 0h2m4 0h7M0 27.5h1m5 0h1m2 0h2m1 0h1m2 0h1m2 0h1m1 0h1m1 0h1m2 0h1m1 0h1M0 28.5h7m1 0h2m2 0h1m1 0h2m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1"/></svg>';
  const tpl = document.getElementById('card').innerHTML.replace('<!--QR-->', QR);
  document.getElementById('sheet').insertAdjacentHTML('beforeend', tpl + tpl);
</script>
</body>
</html>
